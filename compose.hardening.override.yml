name: quantumai-stack
services:
  gli-sepolia:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  mcai-redis:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  mcai-redpanda:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  mcai-postgres:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  mcai-router:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  mcai-trade-engine:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  watchtower:
    restart: unless-stopped
    mem_limit: 128m
    labels:
      autoheal: "false"
  demo-app-redpanda:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  rosettaai:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  dex:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  quantumai-usdt:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  redis:
    restart: unless-stopped
    mem_limit: 768m
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  quantumai-usdt-v2:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  gateway:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  managerai:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  mcai-api:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  postgres-exporter:
    restart: unless-stopped
    mem_limit: 256m
    labels:
      autoheal: "true"
  mcai-feeder:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  demo-app-cadvisor:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  mcai-large-exec:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  mcai-risk:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  mcai-small-agg:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  metrics:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  prometheus:
    restart: unless-stopped
    mem_limit: 768m
    labels:
      autoheal: "false"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null 2>&1 || curl -fsS http://127.0.0.1:9090/-/healthy >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
  autoheal:
    restart: unless-stopped
    mem_limit: 128m
    labels:
      autoheal: "false"
  gli:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  mcai-sim:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  demo-app-redis:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  demo-app-qai:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  grafana:
    restart: unless-stopped
    mem_limit: 768m
    labels:
      autoheal: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null | grep -q 'ok' || curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null | grep -q 'ok'"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 40s
  quantumai-usdt-apps:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  gli-mainnet:
    restart: unless-stopped
    mem_limit: 512m
    labels:
      autoheal: "true"
  cadvisor_iso:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: quantumai-cadvisor-iso
    restart: unless-stopped
    mem_limit: 256m
    labels:
      autoheal: "false"
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,process,hugetlb,resctrl
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s
  autoheal_iso:
    image: willfarrell/autoheal:1.2.0
    container_name: quantumai-autoheal-iso
    restart: unless-stopped
    mem_limit: 64m
    network_mode: "none"
    environment:
      AUTOHEAL_CONTAINER_LABEL: "${AUTOHEAL_LABEL:-autoheal}"
      AUTOHEAL_INTERVAL: "15"
      CURL_TIMEOUT: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      autoheal: "false"
