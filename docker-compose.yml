services:
  quantumai-usdt:
    build: .
    ports:
      - "5003:5002"
    env_file:
      - .env
    environment:
      HOST_PORT: "5002"
    restart: always
    container_name: quantumai-usdt
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:5002/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
