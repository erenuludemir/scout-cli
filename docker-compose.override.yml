services:
  quantumai-usdt-v2:
    build:
      context: ./quantumai-usdt-v2
      dockerfile: Dockerfile
    image: quantumai-usdt-v2:local
    ports:
      - "127.0.0.1:5005:5002"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - ETHERSCAN_CACHE_TTL=60
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
