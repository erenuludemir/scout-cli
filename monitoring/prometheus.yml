global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['quantumai-stack-demo-app-cadvisor-1:8080']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['quantumai-stack-postgres-exporter-1:9187']

  - job_name: 'managerai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['managerai:8012']
