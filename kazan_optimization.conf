# KAZAN ALGORİTMASI - OPTİMİZASYON KONFIG
# Grid Trading with ML Signals - Hedef Parametreler

[TARGETS]
# Hedef Başarı Metrikleri
success_rate_target = 0.95        # %95 başarı oranı
error_recovery_target = 0.98      # Başarısız işlemlerin %98'i çözümlenmeli
uptime_target = 0.99              # %99 sistem çalışma süresi

[GRID_OPTIMIZATION]
# Grid Parametreleri
grid_min_count = 6                 # Minimum grid sayısı
grid_max_count = 30                # Maksimum grid sayısı
grid_default_capital = 1000        # Varsayılan sermaye (USD)

# Dinamik Grid Ayarlama
grid_adjustment_on_volatility = true
high_volatility_threshold = 0.03   # %3'ten yüksek volatilite → geniş grid
low_volatility_threshold = 0.01    # %1'den düşük volatilite → dar grid

[LEVERAGE_OPTIMIZATION]
# Kaldıraç Parametreleri
max_leverage = 5.0                 # Maksimum kaldıraç (5x)
min_leverage = 1.0                 # Minimum kaldıraç (1x)
safe_leverage = 2.0                # Güvenli kaldıraç (normal operasyon)

# Risk Kontrolü
liquidation_buffer_pct = 0.15      # Likidasyondan %15 uzak tutma
margin_call_buffer_pct = 0.20      # Margin call'dan %20 uzak tutma

[SIGNAL_QUALITY]
# Sinyal Kalitesi Eşikleri
min_signal_confidence = 0.58       # Minimum güven seviyesi
classification_threshold_buy = 0.004   # Yukarı yönü sinyali threshold
classification_threshold_sell = -0.004 # Aşağı yönü sinyali threshold

# ML Model Ağırlıkları
sentiment_weight = 0.12            # Duygu analizi
onchain_weight = 0.10              # Zincir analiz
macro_weight = 0.08                # Makro risk
technical_weight = 0.70            # Teknik analiz

[QUANTUM_OPTIMIZATION]
# Quantum Annealing Parametreleri
quantum_iterations = 250           # Optimizasyon iterasyon sayısı
temperature_initial = 100          # Başlangıç sıcaklığı
cooling_rate = 0.95                # Soğutma hızı

[ERROR_RECOVERY]
# Hata Kurtarma Stratejileri
max_retry_attempts = 3             # Maksimum tekrar denemesi
retry_delay_seconds = 5            # Tekrar deneme gecikmesi (saniye)

# Oto Kurtarma Modları
auto_recovery_mode = true
recovery_strategies = [
    "TRAILING_HARD_STOP",          # Yüksek volatilite
    "SOFT_STOP_AND_RECENTER",      # Düşük volatilite
    "GRID_REBALANCE",              # Grid yeniden dengeleme
    "REDUCE_LEVERAGE"              # Kaldıraç azaltma
]

[PERFORMANCE_TARGETS]
# Beklenen Getiri Metrikleri
expected_roi_per_cycle = 0.02      # Döngü başına %2 ROI
expected_roi_annual = 0.15         # Yıllık %15 ROI target
expected_sharpe_ratio = 1.5        # Sharpe ratio hedefi

[MONITORING]
# İzleme Parametreleri
metrics_refresh_interval = 30      # Saniye
signal_persistence_path = /signals
log_level = INFO                   # DEBUG, INFO, WARNING, ERROR
enable_detailed_logging = true

[RISK_MANAGEMENT]
# Risk Yönetimi
max_daily_loss_pct = 0.05         # Günlük maksimum kayıp %5
max_drawdown_pct = 0.10           # Maksimum drawdown %10
position_size_limit = 0.1          # Her pozisyon maksimum portföyün %10'u

# Makro Risk Değerlendirmesi
macro_risk_threshold = 0.4         # Makro risk sınırı (0-1)
volatilite_risk_threshold = 0.03   # Volatilite risk sınırı

[PARAMETRE_AYARLAMA_KURALLARI]
# Otomatik Parametre Ayarlama Mantığı

# Kural 1: Başarı oranı < %95 ise
IF success_rate < 0.95
  - Güven eşiğini düşür: min_signal_confidence -= 0.02
  - Grid aralığını kapat: grid_adjustment *= 0.95
  - Kaldıraçı azalt: max_leverage -= 0.5

# Kural 2: Volatilite yüksek (%3+) ise
IF volatility > 0.03
  - Grid aralığını geniş tut
  - Kaldıraç azalt: leverage *= 0.8
  - Stop-loss'u sıkı ayarla

# Kural 3: Hata kurtarma < %98 ise
IF error_recovery_rate < 0.98
  - Retry attempts artır: max_retry_attempts += 1
  - Recovery delay artır: retry_delay_seconds += 2
  - Oto recovery modunu etkinleştir

# Kural 4: ROI target'e ulaşmadı ise
IF expected_return < expected_roi_per_cycle * 0.8
  - Grid count'ı artır (daha sık işlemler)
  - Sinyal confidence eşiğini ince ayarla
  - Quantum iteration'ları artır: quantum_iterations += 50
