name: QuantumAIMobileApp
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
packages:
  QuantumAIMobile:
    path: ../QuantumAIMobile
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: YH698TG69K
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.erenuludemir.quantumaimobile
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    DEVELOPMENT_TEAM: YH698TG69K
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_DEBUG_DYLIB: NO
targets:
  QuantumAIMobileApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuantumAIMobileApp
    resources:
      - path: QuantumAIMobileApp/Assets.xcassets
      - path: QuantumAIMobileApp/PrivacyInfo.xcprivacy
    info:
      path: QuantumAIMobileApp/Info.plist
      properties:
        CFBundleDisplayName: QuantumAI
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Kimlik doğrulama ve cüzdan onayı için Face ID kullanılır.
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: QuantumAIMobileApp
        PRODUCT_MODULE_NAME: QuantumAIMobileApp
        EXECUTABLE_NAME: QuantumAIMobileApp
        INFOPLIST_FILE: QuantumAIMobileApp/Info.plist
    dependencies:
      - package: QuantumAIMobile
        product: QuantumAIMobile
  QuantumAIMobileAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuantumAIMobileAppUITests
    dependencies:
      - target: QuantumAIMobileApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erenuludemir.quantumaimobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: QuantumAIMobileApp
schemes:
  QuantumAIMobileApp:
    build:
      targets:
        QuantumAIMobileApp: all
    test:
      config: Debug
      targets:
        - QuantumAIMobileAppUITests
    run:
      config: Debug
    archive:
      config: Release
